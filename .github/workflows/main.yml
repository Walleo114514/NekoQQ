name: Build and Release APK

on:
  push:
    tags:
      - 'v*'              # 推送 v* tag 时自动构建并发布 Release
  workflow_dispatch:       # 支持在 Actions 页面手动触发
    inputs:
      tag_name:
        description: '要发布到的 tag 名称（留空则仅构建，不上传 Release）'
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 无论何种触发方式，都先把 APK 作为 Artifact 保存（方便手动构建下载）
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoQQ-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 自动触发（tag push）时发布到 Release
      - name: Upload APK to Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发且填写了 tag_name 时，发布到对应 Release
      - name: Upload APK to Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
