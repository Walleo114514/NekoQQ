name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布到的 tag 名称（留空则仅构建，不上传 Release）'
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==========================================
      # 核心修复步骤：下载 JAR 或 强制注入仓库
      # ==========================================
      - name: Fix Xposed Dependency Automatically
        run: |
          echo "正在尝试下载 Xposed API Jar 包..."
          mkdir -p app/libs
          # 尝试下载官方的 api-82.jar
          curl -L --retry 3 --connect-timeout 15 -o app/libs/api-82.jar "https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar" || true
          
          if [ -f app/libs/api-82.jar ] && [ -s app/libs/api-82.jar ]; then
            echo "✅ JAR包下载成功，正在修改 app/build.gradle.kts 为本地依赖..."
            # 使用正则替换掉所有相关的 compileOnly 或 implementation 依赖
            sed -i -E 's/(compileOnly|implementation)\([ ]*"de.robv.android.xposed:api:[^"]+"[ ]*\)/compileOnly(files("libs\/api-82.jar"))/g' app/build.gradle.kts
            echo "=== 修改后的 app/build.gradle.kts 中 xposed 相关的依赖 ==="
            grep -n "xposed\|api-82.jar" app/build.gradle.kts || echo "未找到匹配项，可能原依赖写法不同"
          else
            echo "❌ 下载 JAR 失败（或超时），将强行把仓库地址注入到 settings.gradle.kts..."
            if [ -f settings.gradle.kts ]; then
              # 强行在 google() 和 mavenCentral() 之后插入 api.xposed.info 仓库
              sed -i 's/google()/google()\n        maven { url = uri("https:\/\/api.xposed.info\/") }/g' settings.gradle.kts
              sed -i 's/mavenCentral()/mavenCentral()\n        maven { url = uri("https:\/\/api.xposed.info\/") }/g' settings.gradle.kts
              echo "=== 修改后的 settings.gradle.kts ==="
              head -n 20 settings.gradle.kts
            fi
          fi

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "正在自动生成缺失的 gradlew..."
            gradle wrapper --gradle-version 8.7
          else
            echo "已找到 gradlew。"
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoQQ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK to Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
